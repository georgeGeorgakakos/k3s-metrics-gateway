[project]
name = "swch-metrics"
version = "0.1.0"
description = "Swarmchestrate k3s Metrics Gateway (per-cluster metrics & topology API) and the EMS sidecar metrics client."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "George Georgakakos"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "kubernetes>=29.0",
  "requests>=2.31",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "stomp.py>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
swch-gateway = "swch_metrics.gateway.__main__:main"
swch-metrics-client = "swch_metrics.client.__main__:main"

[build-system]
requires = ["hatchling>=1.16"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swch_metrics"]

[tool.hatch.build.targets.sdist]
include = ["src/swch_metrics", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
