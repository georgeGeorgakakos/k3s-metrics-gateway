name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match package version
        id: v
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/k3s-metrics-gateway" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push multi-arch image (amd64 + arm64 for edge nodes)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
      - name: Render release manifests
        run: |
          pip install pyyaml pydantic
          python scripts/render_manifest.py --image "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" \
            -o dist/swch-metrics-gateway.yaml --patch-output dist/ems-sidecar-patch.yaml
          python scripts/render_manifest.py --onboard-template --image "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" \
            -o dist/swch-metrics-gateway-onboard.yaml
          cp deploy/onboard/onboard-k3s-host.sh dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/swch-metrics-gateway.yaml
            dist/ems-sidecar-patch.yaml
            dist/swch-metrics-gateway-onboard.yaml
            dist/onboard-k3s-host.sh
