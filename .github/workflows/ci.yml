name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Generated manifests are up to date
        run: |
          python scripts/render_manifest.py
          python scripts/build_demo_data.py
          git diff --exit-code -- deploy/ src/swch_metrics/client/ui/demo-data.json \
            || { echo "::error::Run 'make manifest demo-data' and commit the result"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: UI script syntax
        run: node --check src/swch_metrics/client/ui/app.js

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: k3s-metrics-gateway:ci
