# Alternative to the sidecar: run the client as its own Deployment and publish to the
# EMS service over the network. Use when you cannot (or do not want to) patch EMS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swch-metrics-client
  namespace: swarm-system
  labels: {app.kubernetes.io/name: swch-metrics-client, app.kubernetes.io/part-of: swarmchestrate}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: swch-metrics-client}}
  template:
    metadata: {labels: {app.kubernetes.io/name: swch-metrics-client, app.kubernetes.io/part-of: swarmchestrate}}
    spec:
      containers:
        - name: swch-metrics-client
          image: ghcr.io/georgegeorgakakos/k3s-metrics-gateway:0.3.0
          command: ["swch-metrics-client"]
          ports: [{name: ui, containerPort: 8090}]
          envFrom: [{configMapRef: {name: swch-cluster-identity, optional: true}}]
          env:
            - {name: EMS_BROKER_HOST, value: emsserver-ems-server.swarm-system.svc.cluster.local}
            - {name: GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: swch-metrics-gateway-auth, key: API_KEY, optional: true}}}
            - {name: UI_PASSWORD, valueFrom: {secretKeyRef: {name: swch-metrics-gateway-auth, key: UI_PASSWORD, optional: true}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
          volumeMounts:
            - {name: cfg, mountPath: /etc/swch, readOnly: true}
            - {name: saved, mountPath: /etc/swch-saved, readOnly: true}
            - {name: data, mountPath: /data}
          readinessProbe: {httpGet: {path: /healthz, port: 8090}}
      volumes:
        - {name: cfg, configMap: {name: swch-metrics-client-config, optional: true}}
        - {name: saved, configMap: {name: swch-metrics-client-config-saved, optional: true}}
        - {name: data, emptyDir: {}}
