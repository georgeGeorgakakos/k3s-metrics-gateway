# Swarmchestrate k3s Metrics Gateway v0.3.1 - generated by scripts/render_manifest.py
# Drop into /var/lib/rancher/k3s/server/manifests/ (cluster-builder deploy_manifests) or kubectl apply -f.
apiVersion: v1
kind: Namespace
metadata:
  name: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: 0.3.1
    app.kubernetes.io/part-of: swarmchestrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swch-metrics-gateway
  labels:
    app.kubernetes.io/part-of: swarmchestrate
rules:
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - custom.metrics.k8s.io
  - external.metrics.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - nodes
  - events
  - namespaces
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - nodes/proxy
  - nodes/stats
  - nodes/metrics
  verbs:
  - get
- nonResourceURLs:
  - /metrics
  - /livez
  - /livez/*
  - /readyz
  - /readyz/*
  - /version
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - create
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - update
  - patch
  resourceNames:
  - swch-metrics-topology
  - swch-metrics-client-config-saved
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swch-metrics-gateway
  labels:
    app.kubernetes.io/part-of: swarmchestrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swch-metrics-gateway
subjects:
- kind: ServiceAccount
  name: swch-metrics-gateway
  namespace: swarm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: 0.3.1
    app.kubernetes.io/part-of: swarmchestrate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swch-metrics-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swch-metrics-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: 0.3.1
        app.kubernetes.io/part-of: swarmchestrate
    spec:
      serviceAccountName: swch-metrics-gateway
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: gateway
        image: ghcr.io/georgegeorgakakos/k3s-metrics-gateway:0.3.1
        imagePullPolicy: IfNotPresent
        command:
        - swch-gateway
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: swch-cluster-identity
            optional: true
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: swch-metrics-gateway-auth
              key: API_KEY
              optional: true
        - name: REGISTER_TOKEN
          valueFrom:
            secretKeyRef:
              name: swch-metrics-gateway-auth
              key: REGISTRATION_TOKEN
              optional: true
        - name: REGISTER_INTERVAL
          value: '300'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TOPOLOGY_ENABLED
          value: 'true'
        - name: TOPOLOGY_INTERVAL
          value: '60'
        - name: ATTACH_EMS_SIDECAR
          value: 'false'
        - name: EMS_NAMESPACES
          value: swarm-system,default
        - name: EMS_DEPLOYMENT
          value: emsserver-ems-server
        - name: PROMETHEUS_URL
          value: ''
        - name: ROOT_PATH
          value: /swch-metrics
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: 0.3.1
    app.kubernetes.io/part-of: swarmchestrate
  annotations:
    swarmchestrate.eu/metrics-api: 'true'
    swarmchestrate.eu/topology-configmap: swch-metrics-topology
    swarmchestrate.eu/openapi: /openapi.json
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: swch-metrics-gateway
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: swch-metrics-gateway-strip
  namespace: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
spec:
  stripPrefix:
    prefixes:
    - /swch-metrics
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
spec:
  entryPoints:
  - web
  routes:
  - match: PathPrefix(`/swch-metrics`)
    kind: Rule
    priority: 70
    middlewares:
    - name: swch-metrics-gateway-strip
    services:
    - name: swch-metrics-gateway
      port: 8000
