# Swarmchestrate k3s Metrics Gateway v0.1.0 - generated by scripts/render_manifest.py
# Drop into /var/lib/rancher/k3s/server/manifests/ (cluster-builder deploy_manifests) or kubectl apply -f.
apiVersion: v1
kind: Namespace
metadata:
  name: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swch-cluster-identity
  namespace: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
  annotations:
    swarmchestrate.eu/description: Identity advertised to EMS in the topology and
      in every metric header
data:
  SWARM_ID: ''
  CLUSTER_NAME: ''
  CLOUD: ''
  REGION: ''
  ZONE: ''
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: swch-metrics-gateway-auth
  namespace: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
stringData:
  API_KEY: ''
  UI_PASSWORD: ''
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: 0.1.0
    app.kubernetes.io/part-of: swarmchestrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swch-metrics-gateway
  labels:
    app.kubernetes.io/part-of: swarmchestrate
rules:
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - custom.metrics.k8s.io
  - external.metrics.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - nodes
  - events
  - namespaces
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - nodes/proxy
  - nodes/stats
  - nodes/metrics
  verbs:
  - get
- nonResourceURLs:
  - /metrics
  - /livez
  - /livez/*
  - /readyz
  - /readyz/*
  - /version
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - create
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - update
  - patch
  resourceNames:
  - swch-metrics-topology
  - swch-metrics-client-config-saved
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - patch
  resourceNames:
  - emsserver-ems-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swch-metrics-gateway
  labels:
    app.kubernetes.io/part-of: swarmchestrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swch-metrics-gateway
subjects:
- kind: ServiceAccount
  name: swch-metrics-gateway
  namespace: swarm-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swch-metrics-client-config
  namespace: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
data:
  client.yaml: "client_name: swch-metrics-client\ndefault_interval: 30s\nmetric_prefix:\
    \ swch_k3s_\nlabels:\n  swarm_id: ${SWARM_ID:-}\n  cluster: ${CLUSTER_NAME:-}\n\
    \  cloud: ${CLOUD:-}\n  region: ${REGION:-}\n  zone: ${ZONE:-}\ngateway:\n  url:\
    \ ${GATEWAY_URL:-http://swch-metrics-gateway.swarm-system.svc.cluster.local:8000}\n\
    \  api_key: ${GATEWAY_API_KEY:-}\n  timeout: 10\nui:\n  enabled: true\n  port:\
    \ 8090\n  username: admin\n  password: ${UI_PASSWORD:-}\npersist:\n  mode: gateway\n\
    \  path: /data/client.yaml\nsinks:\n- id: ems\n  type: ems_stomp\n  enabled: true\n\
    \  options:\n    host: ${EMS_BROKER_HOST:-localhost}\n    port: 61610\n    username:\
    \ ${EMS_BROKER_USERNAME:-aaa}\n    password: ${EMS_BROKER_PASSWORD:-111}\n   \
    \ destination: /topic/{metric}\n    body_format: ems_event\n- id: log\n  type:\
    \ log\n  enabled: false\n  options:\n    max_lines: 20\ncollectors:\n- id: nodes\n\
    \  type: node_usage\n  interval: 30s\n- id: pods\n  type: pod_usage\n  interval:\
    \ 30s\n  exclude_namespaces:\n  - kube-system\n- id: pod-utilisation\n  type:\
    \ pod_overview\n  interval: 60s\n  exclude_namespaces:\n  - kube-system\n  metrics:\n\
    \  - pod_cpu_pct_of_limit\n  - pod_memory_pct_of_limit\n  - pod_restarts\n- id:\
    \ warnings\n  type: events\n  interval: 60s\n  params:\n    type: Warning\n- id:\
    \ topology\n  type: topology\n  interval: 2m\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swch-ems-sidecar-template
  namespace: swarm-system
  labels:
    app.kubernetes.io/part-of: swarmchestrate
  annotations:
    swarmchestrate.eu/description: Container patched into the EMS Deployment by the
      gateway
data:
  sidecar.yaml: "container:\n  name: swch-metrics-client\n  image: ghcr.io/georgegeorgakakos/k3s-metrics-gateway:0.1.0\n\
    \  imagePullPolicy: IfNotPresent\n  command:\n  - swch-metrics-client\n  ports:\n\
    \  - name: swch-ui\n    containerPort: 8090\n    protocol: TCP\n  envFrom:\n \
    \ - configMapRef:\n      name: swch-cluster-identity\n      optional: true\n \
    \ env:\n  - name: CONFIG_PATH\n    value: /etc/swch/client.yaml\n  - name: GATEWAY_URL\n\
    \    value: http://swch-metrics-gateway.swarm-system.svc.cluster.local:8000\n\
    \  - name: EMS_BROKER_HOST\n    value: localhost\n  - name: GATEWAY_API_KEY\n\
    \    valueFrom:\n      secretKeyRef:\n        name: swch-metrics-gateway-auth\n\
    \        key: API_KEY\n        optional: true\n  - name: UI_PASSWORD\n    valueFrom:\n\
    \      secretKeyRef:\n        name: swch-metrics-gateway-auth\n        key: UI_PASSWORD\n\
    \        optional: true\n  - name: POD_NAMESPACE\n    valueFrom:\n      fieldRef:\n\
    \        fieldPath: metadata.namespace\n  - name: POD_IP\n    valueFrom:\n   \
    \   fieldRef:\n        fieldPath: status.podIP\n  - name: NODE_NAME\n    valueFrom:\n\
    \      fieldRef:\n        fieldPath: spec.nodeName\n  volumeMounts:\n  - name:\
    \ swch-client-config\n    mountPath: /etc/swch\n    readOnly: true\n  - name:\
    \ swch-client-config-saved\n    mountPath: /etc/swch-saved\n    readOnly: true\n\
    \  - name: swch-client-data\n    mountPath: /data\n  readinessProbe:\n    httpGet:\n\
    \      path: /healthz\n      port: 8090\n    periodSeconds: 10\n  livenessProbe:\n\
    \    httpGet:\n      path: /healthz\n      port: 8090\n    periodSeconds: 30\n\
    \    failureThreshold: 5\n  resources:\n    requests:\n      cpu: 25m\n      memory:\
    \ 64Mi\n    limits:\n      cpu: 300m\n      memory: 192Mi\n  securityContext:\n\
    \    allowPrivilegeEscalation: false\n    readOnlyRootFilesystem: true\n    runAsNonRoot:\
    \ true\n    runAsUser: 10001\n    capabilities:\n      drop:\n      - ALL\nvolumes:\n\
    - name: swch-client-config\n  configMap:\n    name: swch-metrics-client-config\n\
    \    optional: true\n- name: swch-client-config-saved\n  configMap:\n    name:\
    \ swch-metrics-client-config-saved\n    optional: true\n- name: swch-client-data\n\
    \  emptyDir:\n    sizeLimit: 256Mi\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: 0.1.0
    app.kubernetes.io/part-of: swarmchestrate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swch-metrics-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swch-metrics-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: 0.1.0
        app.kubernetes.io/part-of: swarmchestrate
    spec:
      serviceAccountName: swch-metrics-gateway
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: gateway
        image: ghcr.io/georgegeorgakakos/k3s-metrics-gateway:0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - swch-gateway
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: swch-cluster-identity
            optional: true
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: swch-metrics-gateway-auth
              key: API_KEY
              optional: true
        - name: GATEWAY_URL
          value: http://swch-metrics-gateway.swarm-system.svc.cluster.local:8000
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TOPOLOGY_ENABLED
          value: 'true'
        - name: TOPOLOGY_INTERVAL
          value: '60'
        - name: ATTACH_EMS_SIDECAR
          value: 'true'
        - name: EMS_NAMESPACES
          value: swarm-system,default
        - name: EMS_DEPLOYMENT
          value: emsserver-ems-server
        - name: PROMETHEUS_URL
          value: ''
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: swch-metrics-gateway
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: 0.1.0
    app.kubernetes.io/part-of: swarmchestrate
  annotations:
    swarmchestrate.eu/metrics-api: 'true'
    swarmchestrate.eu/topology-configmap: swch-metrics-topology
    swarmchestrate.eu/openapi: /openapi.json
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: swch-metrics-gateway
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: swch-metrics-client-ui
  namespace: swarm-system
  labels:
    app.kubernetes.io/name: swch-metrics-client
    app.kubernetes.io/component: sidecar-ui
    app.kubernetes.io/version: 0.1.0
    app.kubernetes.io/part-of: swarmchestrate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ems-server
  ports:
  - name: ui
    port: 8090
    targetPort: 8090
