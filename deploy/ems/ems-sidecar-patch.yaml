# Strategic-merge patch adding the metrics-client sidecar to the EMS Deployment.
# Only needed when the gateway's automatic attacher is disabled (--no-attach-sidecar):
#   kubectl -n swarm-system patch deployment emsserver-ems-server --patch-file ems-sidecar-patch.yaml
metadata:
  annotations:
    swarmchestrate.eu/metrics-sidecar: attached
spec:
  template:
    metadata:
      annotations:
        swarmchestrate.eu/metrics-sidecar: attached
    spec:
      containers:
      - name: swch-metrics-client
        image: ghcr.io/georgegeorgakakos/k3s-metrics-gateway:0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - swch-metrics-client
        ports:
        - name: swch-ui
          containerPort: 8090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: swch-cluster-identity
            optional: true
        env:
        - name: CONFIG_PATH
          value: /etc/swch/client.yaml
        - name: GATEWAY_URL
          value: http://swch-metrics-gateway.swarm-system.svc.cluster.local:8000
        - name: EMS_BROKER_HOST
          value: localhost
        - name: GATEWAY_API_KEY
          valueFrom:
            secretKeyRef:
              name: swch-metrics-gateway-auth
              key: API_KEY
              optional: true
        - name: UI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swch-metrics-gateway-auth
              key: UI_PASSWORD
              optional: true
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: swch-client-config
          mountPath: /etc/swch
          readOnly: true
        - name: swch-client-config-saved
          mountPath: /etc/swch-saved
          readOnly: true
        - name: swch-client-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
      volumes:
      - name: swch-client-config
        configMap:
          name: swch-metrics-client-config
          optional: true
      - name: swch-client-config-saved
        configMap:
          name: swch-metrics-client-config-saved
          optional: true
      - name: swch-client-data
        emptyDir:
          sizeLimit: 256Mi
